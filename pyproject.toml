[project]
name = "bim-asr"
version = "0.0.1"
description = "Caribbean-aware speech recognition stack: FastConformer + Qwen3-4B + LoRA"
authors = [{ name = "Matt Hamilton", email = "matt@dharach.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "torch>=2.2",
  "transformers>=4.51",
  "datasets>=2.20",
  "peft>=0.11",
  "accelerate>=0.33",
  "soundfile>=0.12",
  "librosa>=0.10",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
  "jiwer>=3.0",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "einops>=0.8",
  "tiktoken>=0.7",
  "numpy<3",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.27",
  "mlx-lm>=0.27",
  "mlx-metal>=0.27",
]
audio = [
  "torchcodec>=0.1",
  "yt-dlp>=2024.5",
  "ffmpeg-python>=0.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
  "ipython",
  "jupyter",
]

[project.urls]
Homepage = "https://github.com/hammertoe/bim-asr"
HuggingFace = "https://huggingface.co/hammertoe"
Previous = "https://huggingface.co/hammertoe/BimOmni-30B-A3B"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bim_asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
